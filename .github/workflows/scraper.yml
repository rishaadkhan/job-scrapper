name: Daily Job Scraper & Intelligence Ingestion

on:
  schedule:
    - cron: '0 3 * * *'  # Runs at 3 AM UTC daily (8:30 AM IST)
  workflow_dispatch:  # Allows manual runs from GitHub UI

jobs:
  scrape-and-score:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Initialize Database & Run Migrations
      env:
        DATABASE_URL: sqlite+aiosqlite:///jobscraper.db
        ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL || 'admin@jobscraper.local' }}
        ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD || 'admin123' }}
      run: |
        python -m backend.migrate
    
    - name: Execute Async Ingestion & Match Scoring Engine
      env:
        DATABASE_URL: sqlite+aiosqlite:///jobscraper.db
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        ANTHROPIC_MODEL: claude-3-5-sonnet-latest
        LLM_SUGGESTION_THRESHOLD: 60
        RESUME_FILE: resume.md
        # Observability
        SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        ENVIRONMENT: production
        HEARTBEAT_URL: ${{ secrets.HEARTBEAT_URL }}
        # Digest notifications
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        DIGEST_SCORE_THRESHOLD: 60
        DIGEST_TOP_N: 10
        SMTP_HOST: ${{ secrets.SMTP_HOST }}
        SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
        SMTP_USER: ${{ secrets.SMTP_USER }}
        SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        SMTP_TO: ${{ secrets.SMTP_TO }}
      run: |
        python main.py
    
    - name: Run Export Retention Purge
      env:
        DATABASE_URL: sqlite+aiosqlite:///jobscraper.db
        RETENTION_DAYS: 14
      run: |
        python -m backend.retention
    
    - name: Upload Daily Job Leads Excel Artifact
      uses: actions/upload-artifact@v4
      with:
        name: high-conversion-job-leads-${{ github.run_id }}
        path: output/*.xlsx
        retention-days: 14
        if-no-files-found: ignore
